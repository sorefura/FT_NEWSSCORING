# config.yaml — RSSフィード、対象ティッカー、コスト前提
# SPEC.md §3, §5, §6.2, §7 参照

pipeline_version: "1.1.0"

news:
  # SPEC §4.1: 市況/マクロカテゴリの公開RSS。日経・ロイターの当初想定URLは404で
  # 廃止済みだったため、疎通確認済みの以下2フィードに差し替えている。
  feeds:
    - name: nhk_keizai
      url: "https://news.web.nhk/n-data/conf/na/rss/cat5.xml"
    - name: yahoo_keizai
      url: "https://news.yahoo.co.jp/rss/topics/business.xml"
  # INSTRUCTION_004: フィード構成が異なる期間を評価時に混ぜないため、
  # この構成で採点した全レコードに同じ系列IDを保存する。
  feed_set: "nhk_news_web+yahoo"
  feed_health:
    # 各フィードの生エントリ数がこの回数連続で0なら、他フィードが正常でも異常とする。
    consecutive_zero_limit: 3
  # SPEC §7: 日次採点上限。超過分は繰り越さず欠測として記録
  daily_scoring_limit: 50
  # SPEC §4.2/§4.4 制約B: 採点対象は取得時点から48時間以内に公開されたニュースのみ
  max_news_age_hours: 48

scoring:
  # SPEC §4.3: 採点は安価な分類モデルに固定。Fable/Opusは禁止
  model: "claude-haiku-4-5-20251001"
  allowed_models:
    - "claude-haiku-4-5-20251001"
  # temperature=0・3回採点はSPEC §4.3が定めるプロトコル定数であり、運用で変える
  # 設定値ではないため src/score.py 側に固定値として持つ(config.yamlには置かない)。
  prompt_version: "v1"
  prompt_path: "prompts/scorer_v1.md"
  # SPEC §4.4: 再現性検査(校正)の不合格基準
  calibration:
    range_threshold: 2
    failure_rate_threshold: 0.20
    lookback_months: 3

prices:
  # SPEC §5: 初期対象は日経225のみ。フェーズ2で個別銘柄を追加
  symbols:
    - symbol: "^N225"
      kind: "index"
  horizons_business_days: [1, 5, 20]

costs:
  # SPEC §6.2: 往復コスト(初期値は保守的に)
  round_trip_cost_index: 0.002
  round_trip_cost_single_stock: 0.005

evaluation:
  bootstrap_resamples: 10000
  # §6.1のバケット別集計表で「判定保留」の注記を付ける最小サンプル数(§6.3)。
  # H1〜H3の正式な棄却基準で使うN=60(SPEC §1.3)とは別物で、これは記述統計の
  # バケット表にのみ適用される。
  min_n_for_judgement: 30
