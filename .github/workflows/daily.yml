name: daily

on:
  schedule:
    # JST 07:00 月〜金 = UTC 22:00 日〜木 (SPEC §3)
    - cron: "0 22 * * 0,1,2,3,4"
    # JST 16:30 月〜金 = UTC 07:30 月〜金 (SPEC §3)
    - cron: "30 7 * * 1-5"
    # 月次評価(手動 or 月次, SPEC §3): 毎月1日 UTC 00:00 に実行
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      task:
        description: "手動実行するタスク"
        type: choice
        options: [collect, evaluate]
        default: collect

permissions:
  contents: write

concurrency:
  group: ftns-daily-pipeline
  cancel-in-progress: false

jobs:
  collect:
    # fetch_news.py は score.py が内部でライブラリとして呼び出す(src/score.py 参照)。
    # このジョブは日次収集用の2つのcronのみで起動する(月次evaluate用cronでは起動しない)。
    if: >-
      (github.event_name == 'schedule' && github.event.schedule != '0 0 1 * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'collect')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # main(コード)をルートへ

      - uses: actions/checkout@v4 # dataブランチを ./data へ(INSTRUCTION_002 タスク3)
        with:
          ref: data
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: "run tests (SPEC §10: ガードが壊れた状態で先に進まない)"
        run: python -m pytest tests/ -q

      - name: score.py (内部で fetch_news.py の取得処理を呼び出す)
        id: score
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/score.py

      - name: fetch_prices.py
        if: steps.score.outcome == 'success'
        run: python src/fetch_prices.py

      - name: "commit data (append-only, dataブランチへ)"
        # score.py が死活ガードで失敗した場合も feed_health.jsonl の観測を監査証跡へ残す。
        if: always()
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- scores.jsonl prices.parquet
          test ! -e feed_health.jsonl || git add -- feed_health.jsonl
          git diff --cached --quiet && exit 0
          git commit -m "chore: update scores/prices/feed health [skip ci]"
          for i in 1 2 3; do
            git push origin HEAD:data && exit 0
            git pull --rebase origin data
          done
          echo "::error::dataブランチへのpushが3回失敗" && exit 1

      - name: "fail collect if score.py failed"
        if: always() && steps.score.outcome == 'failure'
        run: exit 1

  evaluate:
    # 月次評価は手動 or 月次(SPEC §3)。日次収集の失敗有無に関わらず独立して実行する。
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 0 1 * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'evaluate')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # main(コード)をルートへ

      - uses: actions/checkout@v4 # dataブランチを ./data へ(INSTRUCTION_002 タスク3)
        with:
          ref: data
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: "run tests (SPEC §10: ガードが壊れた状態で先に進まない)"
        run: python -m pytest tests/ -q

      - name: evaluate.py
        run: python src/evaluate.py

      - name: "commit report (dataブランチへ)"
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet && exit 0
          git commit -m "chore: monthly evaluation report [skip ci]"
          for i in 1 2 3; do
            git push origin HEAD:data && exit 0
            git pull --rebase origin data
          done
          echo "::error::dataブランチへのpushが3回失敗" && exit 1
